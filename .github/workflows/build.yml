name: build

on:
  push:
    branches: [main, next]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # kgsl_nowait.ko for each GKI kernel series, built against that series'
  # headers with its compiler (the DDK images). Only android16-6.12 has run
  # on a phone; a series whose image or build fails is left out.
  kmod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.kmi != 'android16-6.12' }}
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    steps:
      - uses: actions/checkout@v4

      - name: Build kgsl_nowait.ko
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          img=
          for tag in "$KMI-20260313" "$KMI"; do
            if docker pull -q "ghcr.io/ylarod/ddk-min:$tag"; then img="ghcr.io/ylarod/ddk-min:$tag"; break; fi
          done
          [ -n "$img" ] || { echo "no DDK image for $KMI"; exit 1; }
          echo "image: $img"
          docker run --rm -v "$PWD/kmod:/work" "$img" sh -c '
            set -e
            K=$(ls -d /opt/ddk/kdir/* | head -n 1)
            CLANG=$(echo /opt/ddk/clang/clang-r*/bin)
            echo "kernel: $K, release $(cat $K/include/config/kernel.release 2>/dev/null)"; echo "clang: $CLANG"
            make -C $K M=/work ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=$CLANG/clang LD=$CLANG/ld.lld AR=$CLANG/llvm-ar NM=$CLANG/llvm-nm OBJCOPY=$CLANG/llvm-objcopy OBJDUMP=$CLANG/llvm-objdump STRIP=$CLANG/llvm-strip CROSS_COMPILE=aarch64-linux-gnu- modules
            $CLANG/llvm-strip --strip-debug /work/kgsl_nowait.ko
            # phones ship their modules without BTF; one built against other headers could only fail to validate
            $CLANG/llvm-objcopy --remove-section=.BTF --remove-section=.BTF.base /work/kgsl_nowait.ko
          '
          readelf -p .modinfo kmod/kgsl_nowait.ko
          mkdir out && cp kmod/kgsl_nowait.ko "out/kgsl_nowait-$KMI.ko"

      - uses: actions/upload-artifact@v4
        with:
          name: kmod-${{ matrix.kmi }}
          path: out/

  build:
    runs-on: ubuntu-latest
    needs: kmod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Module tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox-static >/dev/null
          bash tests/run.sh mksh
          bash tests/run.sh dash
          bash tests/run.sh "busybox ash"

      - name: Versions agree
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          [ "$(jq -r '.metamodule | type' module.json)" = boolean ] || { echo "module.json: metamodule must be true or false"; exit 1; }
          # a test build on the next branch has a version of its own and is announced nowhere
          if [ "$GITHUB_REF" = refs/heads/next ]; then exit 0; fi
          [ "$(jq -r .version update.json)" = "$version" ] || { echo "update.json: version is not $version"; exit 1; }
          [ "$(jq -r .versionCode update.json)" = "$code" ] || { echo "update.json: versionCode is not $code"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          case $GITHUB_REF in refs/tags/*)
            [ "$GITHUB_REF_NAME" = "$version" ] || { echo "tag $GITHUB_REF_NAME is not $version"; exit 1; } ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The key itself is the secret; its password is not one. Without it the
      # app is signed with a key nobody keeps: it works, but the next version
      # cannot update it in place, so the installer replaces it.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEJANK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "DEJANK_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          else
            echo "::warning::No signing key in the secrets: the app is signed with a throwaway debug key"
          fi

      - name: Build the app
        env:
          DEJANK_KEYSTORE_PASSWORD: dejank
          DEJANK_KEY_ALIAS: dejank
          DEJANK_KEY_PASSWORD: dejank
        run: ./gradlew :app:assembleRelease

      - name: Signed by
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          got=$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "certificate SHA-256: $got"
          if [ -n "$DEJANK_KEYSTORE" ] && [ "$got" != "$RELEASE_CERT" ]; then
            echo "::error::The secret holds another key than the release key ($RELEASE_CERT)"
            exit 1
          fi
        env:
          RELEASE_CERT: a196e1a183fcf3419c2fbe3426f708985ee7a027655176add859d5b6113fbadc

      - uses: actions/download-artifact@v4
        with:
          pattern: kmod-*
          merge-multiple: true
          path: module/kmod

      - name: Kernel modules in the zip
        run: |
          ls -la module/kmod
          [ -f module/kmod/kgsl_nowait-android16-6.12.ko ] || { echo "the build for android16-6.12 is missing"; exit 1; }

      - name: Package the module
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk module/dejank.apk
          cp LICENSE module/LICENSE
          version=$(sed -n 's/^version=//p' module/module.prop)
          (cd module && zip -r -q "../out/oneui-dejank-$version.zip" .)
          unzip -l out/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: oneui-dejank
          path: out/

      # A test build: the zip goes to the "latest" pre-release, which no updater reads.
      - name: Test build
        if: github.ref == 'refs/heads/next'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest out/*.zip --clobber

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md >notes.md
          # a release published on GitHub already exists and only lacks the zip
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" out/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  # Renders the screens on the JVM so layout changes can be reviewed without a
  # phone. Never blocks the build above.
  renders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screens
        # --rerun: a result taken from the build cache writes no pictures
        run: ./gradlew :app:testDebugUnitTest --rerun -Pscreenshots --tests '*ScreenshotTest*'

      # kept on a branch of their own, replaced by every build of main (renders) or next (renders-next)
      - name: Publish renders
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/screenshots || exit 0
          to=renders
          [ "$GITHUB_REF" = refs/heads/next ] && to=renders-next
          git init -q -b "$to"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Renders of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$to"
